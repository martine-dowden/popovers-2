<!DOCTYPE html>
<html lang="en-US">

<head>
  <title>Demo: Popover</title>
  <link href="../global.styles.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .btn {
      anchor-name: --btn;
    }

    .popover {
      position-anchor: --btn;
      position-area: bottom span-left;
      position-try-fallbacks: --right, --middle;
      font-size: 2rem;
    }

    @position-try --right {
      position-area: bottom span-right;
    }

    @position-try --middle {
      position-area: bottom span-all;
    }
  </style>
</head>

<body>
  <main>
    <h1>Demo Popover</h1>
    <div class="example">
      <button class="btn" type="button" popovertarget="my-popover">
        Toggle Content
      </button>
      <div id="my-popover" class="popover" popover>
        All you need is love. But a little chocolate now and then doesn't hurt.
      </div>
    </div>
  </main>
  <nav aria-label="Main Nav">
    <ul>
      <li><a href="/index.html">Home</a></li>
      <li><a href="/examples/hover.html">Hover</a></li>
      <li><a href="/examples/popover.html">Popover</a></li>
      <li><a href="/examples/popover-js.html">JS Popover</a></li>
      <li><a href="/examples/mix.html">Mix</a></li>
      <li><a href="/examples/accessibility-options.html">Accessibility Options</a></li>
    </ul>
  </nav>
</body>

</html>
